name: Release

# Push a tag like v1.0.0 to release. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="cqlc"))')
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$version"; exit 1; }
      - name: changelog has an entry
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - run: cargo test --workspace

  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p cqlc --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          dir="cqlc-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp LICENSE NOTICE README.md CHANGELOG.md "$dir/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/cqlc.exe" "$dir/"
            7z a "$dir.zip" "$dir"
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/cqlc" "$dir/"
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io. Publish locally with cargo publish -p cqlc-core, cqlc-codegen, cqlc."
            exit 0
          fi
          for crate in cqlc-core cqlc-codegen cqlc; do
            cargo publish -p "$crate"
            # let the index catch up before the next crate depends on it
            sleep 30
          done
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '$0 ~ "^## \\["v"\\]" {p=1; next} p && /^## \[/ {exit} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "cqlc $version" --notes "$notes"
