# Local Cassandra for the end-to-end example:
#   docker compose up -d --wait
#   cargo run -p cqlc-example-basic
services:
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      # Advertise the published port, so the driver does not try the container's
      # (often unrouted) bridge address.
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
