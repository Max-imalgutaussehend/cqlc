# Local Cassandra for the end-to-end example:
#   docker compose up -d --wait
#   cargo run -p cqlc-example-basic
services:
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
