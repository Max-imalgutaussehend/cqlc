[package]
name = "cqlc"
description = "Static CQL analyzer and Rust code generator for Cassandra-compatible databases, like sqlc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/Max-imalgutaussehend/cqlc#readme"
rust-version.workspace = true
keywords.workspace = true
categories = ["database", "development-tools", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "cqlc"
path = "src/main.rs"

[dependencies]
cqlc-core.workspace = true
cqlc-codegen.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
